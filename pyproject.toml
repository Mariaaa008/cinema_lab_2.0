[project]
name = "cinema-lab"
version = "0.1.0"
description = "Cinema Booking System"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
]

[project.scripts]
cinema = "src.cli:main"
